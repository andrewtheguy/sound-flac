[package]
name = "sound-flac"
version = "0.0.8"
edition = "2024"
license = "MIT"
repository = "https://github.com/andrewtheguy/sound-flac"
description = "FLAC for a desktop's sound, as wlshare and the zDesk gateway both code it: a frame of every block, made the moment the block is whole and on its own, by an encoder of its own in plain Rust"

# The one place a desktop's sound is made FLAC. Platform-independent and
# dependency-light on purpose: the wlshare daemon and the zDesk gateway both
# build it, each pinned to a release tag of this repository, and a change to how
# that sound is coded is made here once for both.
[dependencies]
thiserror = "2"

[dev-dependencies]
# The encoder's frames are read back by symphonia's decoder, which shares
# nothing with this crate. Only the FLAC bundle of symphonia, with
# `symphonia-core` for the decoder trait and the packet it takes.
symphonia-bundle-flac = "0.6"
symphonia-core = "0.6"
